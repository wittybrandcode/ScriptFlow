name: ScriptFlow Enterprise CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Build, Type Check & Test Pipeline
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Linux GUI & WebKit Dependencies (Tauri Linux Support)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Build All Monorepo Packages
        run: npm run build

      - name: TypeScript Type Check (Core, DB, App, Nasab, Desktop)
        run: |
          npx tsc --noEmit --project packages/core/tsconfig.json
          npx tsc --noEmit --project packages/database/tsconfig.json
          npx tsc --noEmit --project packages/application/tsconfig.json
          npx tsc --noEmit --project packages/nasab/tsconfig.json
          npx tsc --noEmit --project apps/desktop/tsconfig.json

      - name: Run Workspace Tests
        run: npm test --workspaces --if-present

      - name: Cargo Check Tauri Backend
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
